name: Trigger test odoo 19

on:
  push:
    branches:
      - "19.0-dev"
      - "19.0"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger event on frepple repository
        uses: actions/github-script@v8
        with:
          token: ${{ secrets.COMMUNITY_GITHUB_TOKEN }}
          repo: frepple
          owner: frePPLe
          event_type: odoo_connector_19
          message: |
            {
              "branch": "${{ github.ref_name }}"
            }

