name: Trigger test odoo 20

on:
  push:
    branches:
      - "20.0-dev"
      - "20.0"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger event on frepple repository
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.COMMUNITY_GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "frePPLe",
              repo: "frepple",
              event_type: "odoo_connector_20",
              client_payload: {
                message: {
                  branch: process.env.BRANCH
                }
              }
            });


