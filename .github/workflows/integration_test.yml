name: Trigger test odoo 20

on:
  push:
    branches:
      - "20.0-dev"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger event on frepple repository
        uses: mvasigh/dispatch-action@main
        with:
          token: ${{ secrets.COMMUNITY_GITHUB_TOKEN }}
          repo: frepple
          owner: frePPLe
          event_type: odoo_connector_20

