name: Trigger test odoo 19

on:
  push:
    branches:
      - "19.0-dev"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger event on frepple repository
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COMMUNITY_GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "frePPLe",
              repo: "frepple",
              event_type: "odoo_connector_19",
            });

