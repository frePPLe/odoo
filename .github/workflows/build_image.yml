name: Build and Push Odoo + frePPLe Docker Image to GHCR

on:
  push:
    branches:
      - "20.0"
  schedule:
      - cron: "0 0 * * 0"

jobs:
  build:
    if: github.repository == 'frePPLe/odoo' && (github.ref == 'refs/heads/20.0' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        ref: "20.0"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        IMAGE_BASE=ghcr.io/frepple/frepple-enterprise-dev/odoo_frepple
        docker build --build-arg PROXYMODE=true -t $IMAGE_BASE:20.0 .

    - name: Push Docker Image
      run: |
        IMAGE_BASE=ghcr.io/frepple/frepple-enterprise-dev/odoo_frepple
        docker push $IMAGE_BASE:20.0
